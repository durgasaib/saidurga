# Deployment
apiVersion: app/v1
kind: Deployment
metadata: 
  name: login
spec: 
  replicas: 2
  selector:
    matchlabels: 
      app: login
  templates:
    metadata:
      lables:
        app: login
    spec:
      containers:
      - name: c1
      image: durgasaib/saidurga
      ports:
      - containerPorts: 80
  ----
  # service
apiVersion: v1
kind: service
metadata:
  name: login-svc
spec:
  type: LoadBalancer
  ports:
  - ports:
  selector:
    app: login

